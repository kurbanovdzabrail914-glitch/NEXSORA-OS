
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA OS</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 color:white;
 background:#101d30;
 overflow:hidden;
}

button{font:inherit;cursor:pointer;color:white}

#lock,#desktop{
 position:fixed;
 inset:0;
 background:
 radial-gradient(ellipse at 75% 20%,#7898a7 0%,transparent 40%),
 linear-gradient(145deg,#152b42,#42677b 50%,#101c30);
}

#lock{
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
 transition:opacity .5s;
}

.brand{
 position:absolute;
 top:35px;
 left:35px;
 font-size:21px;
 font-weight:bold;
 letter-spacing:7px;
}

.clock{
 font-size:clamp(85px,17vw,145px);
 font-weight:200;
 letter-spacing:-7px;
}

.date{
 font-size:19px;
 color:#e0eaf1;
 margin-top:5px;
}

.unlock{
 margin-top:60px;
 padding:15px 35px;
 border:1px solid #ffffff70;
 border-radius:30px;
 background:#ffffff20;
 backdrop-filter:blur(20px);
}

.unlock:hover{background:#ffffff40}

#desktop{
 display:none;
 padding:35px;
}

#desktop.show{display:block}

.desktop-brand{
 font-size:22px;
 font-weight:bold;
 letter-spacing:6px;
}

.welcome{
 position:absolute;
 top:34%;
 left:8%;
}

.welcome h1{
 font-size:clamp(35px,7vw,75px);
 font-weight:300;
 margin-bottom:10px;
}

.welcome p{color:#dce8f1}

.taskbar{
 position:absolute;
 bottom:18px;
 left:50%;
 transform:translateX(-50%);
 display:flex;
 gap:12px;
 padding:12px;
 border:1px solid #ffffff40;
 border-radius:20px;
 background:#14253bc9;
 backdrop-filter:blur(25px);
}

.taskbar button{
 border:0;
 border-radius:12px;
 background:#ffffff18;
 padding:12px;
 font-size:23px;
}

.taskbar button:hover{background:#ffffff40}

.window{
 display:none;
 position:absolute;
 top:20%;
 left:50%;
 transform:translateX(-50%);
 width:min(450px,90vw);
 min-height:220px;
 padding:20px;
 border:1px solid #ffffff50;
 border-radius:20px;
 background:#14253bf2;
 backdrop-filter:blur(25px);
 box-shadow:0 20px 80px #0008;
}

.window.show{display:block}

.window-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #ffffff30;
 padding-bottom:12px;
}

.window-header button{
 background:none;
 border:0;
 font-size:22px;
}

.window-content{
 padding:15px 0;
 line-height:1.7;
 color:#e0eaf3;
}

@media(max-width:500px){
 #desktop{padding:22px}
 .brand{left:22px}
 .welcome{left:7%}
}
</style>
</head>

<body>

<section id="lock">
 <div class="brand">NEXORA</div>
 <div class="clock" id="clock">00:00</div>
 <div class="date" id="date"></div>
 <button class="unlock" onclick="unlock()">
  Разблокировать →
 </button>
</section>

<section id="desktop">
 <div class="desktop-brand">NEXORA</div>

 <div class="welcome">
  <h1>Добро пожаловать.</h1>
  <p>NEXORA OS 0.2</p>
 </div>

 <div class="taskbar">
  <button onclick="openApp('Файлы','Файловый менеджер NEXORA')">📁</button>
  <button onclick="openApp('Браузер','NEXORA Browser')">🌐</button>
  <button onclick="openApp('Настройки','Настройки системы')">⚙️</button>
  <button onclick="openApp('Музыка','NEXORA Music')">🎵</button>
  <button onclick="lock()">🔒</button>
 </div>
</section>

<div class="window" id="window">
 <div class="window-header">
  <strong id="title">Приложение</strong>
  <button onclick="closeApp()">✕</button>
 </div>
 <div class="window-content" id="content"></div>
</div>

<script>
function updateClock(){
 const now=new Date();

 document.getElementById("clock").textContent=
 now.toLocaleTimeString("ru-RU",{
  hour:"2-digit",
  minute:"2-digit"
 });

 document.getElementById("date").textContent=
 now.toLocaleDateString("ru-RU",{
  weekday:"long",
  day:"numeric",
  month:"long"
 });
}

updateClock();
setInterval(updateClock,1000);

function unlock(){
 document.getElementById("lock").style.display="none";
 document.getElementById("desktop").classList.add("show");
}

function lock(){
 closeApp();
 document.getElementById("desktop").classList.remove("show");
 document.getElementById("lock").style.display="flex";
}

function openApp(title,content){
 document.getElementById("title").textContent=title;
 document.getElementById("content").textContent=content;
 document.getElementById("window").classList.add("show");
}

function closeApp(){
 document.getElementById("window").classList.remove("show");
}
</script>

</body>
</html>
